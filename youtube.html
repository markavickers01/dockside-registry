<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Player Relay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DockSide helper videos (OPEN-254). Replaces the RBBYoutubeReferrer page on the Nautical Options
       Salesforce Site: the app's WebView sends no referrer, so YouTube embeds need a real https page.
       Takes v (video Id) and t (start seconds) from the query string. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    body { margin: 0; background: #000; }
    iframe { border: none; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <iframe id="yt"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var v = p.get('v') || '';
      var t = parseInt(p.get('t') || '0', 10);
      // A YouTube video Id is letters, digits, - and _ only; anything else is refused.
      if (!/^[A-Za-z0-9_-]{6,20}$/.test(v)) { document.body.innerHTML = ''; return; }
      if (!(t >= 0)) t = 0;
      document.getElementById('yt').src =
        'https://www.youtube.com/embed/' + v + '?start=' + t + '&autoplay=0&playsinline=1&rel=0';
    })();
  </script>
</body>
</html>
